name: Windows app and source release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    # GitHub's hosted Windows runner is Server, not a physical Windows 11 workstation.
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      # Hosted Windows has no usable hardware GPU. Keep Chromium sandbox enabled.
      QTWEBENGINE_CHROMIUM_FLAGS: "--use-gl=angle --use-angle=swiftshader"
      QT_LOGGING_RULES: "qt.webenginecontext=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install user requirements
        run: python -m pip install -r requirements.txt
      - name: Rebuild UTF-8 local UI assets
        run: |
          python scripts/sync_preview_modules.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Headless launcher preflight
        run: python launch.py --check
      - name: Direct module entry imports with this Python
        run: python -m optics_ui --help
      - name: CMD launcher from a different directory with Unicode and spaces
        run: python scripts/check_windows_launcher.py
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript unit tests
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem tests -Filter '*.cjs' | ForEach-Object { $_.FullName }
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source-only feedback ZIP
        run: python scripts/build_feedback_release.py
      - name: Native workbench and real Qt desktop smoke
        run: python scripts/smoke_workbench.py
      - name: Independent chart windows, layout and unsaved-close acceptance
        run: python scripts/smoke_analysis_windows.py
      - name: Pareto desktop smoke
        run: python scripts/smoke_pareto.py
      - name: Preserve desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-evidence-py${{ matrix.python-version }}
          path: |
            artifacts/workbench-smoke/*.json
            artifacts/workbench-smoke/*.log
            artifacts/workbench-smoke/*.png
            artifacts/analysis-windows-smoke/*.json
            artifacts/analysis-windows-smoke/*.log
            artifacts/analysis-windows-smoke/*.png
            artifacts/pareto-smoke/desktop-app.json
            artifacts/pareto-smoke/*.png
          if-no-files-found: warn
      - name: Preserve source-only feedback release
        uses: actions/upload-artifact@v4
        with:
          name: optics-feedback-release-py${{ matrix.python-version }}
          path: |
            release/Optics-Studio-v1.1.0.zip
            release/Optics-Studio-v1.1.0.zip.sha256
            release/SHA256SUMS
          if-no-files-found: error
