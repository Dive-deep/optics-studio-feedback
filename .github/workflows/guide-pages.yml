name: Publish user guide
on:
  push:
    branches: ['feedback/windows-preview']
    paths: ['guide/dist/**', '.github/workflows/guide-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guide/dist
      - name: Deploy guide only
        id: deployment
        uses: actions/deploy-pages@v4
