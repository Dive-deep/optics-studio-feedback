(function(){

const titles={explorer:'Explorer',workspace:'Workspace',tailoring:'DB tailoring',update:'Update model',sim:'Add Zemax Sim',auto:'Auto design'};

const files={
 'design_driver.py':{lang:'Python',text:'# Optical design workflow — illustrative code\nfrom optics.parameters import OpticalSystem\nfrom workflows import evaluate, propose\n\ndef review_candidate(prescription, model):\n    system = OpticalSystem.from_dict(prescription)\n    prediction = evaluate(system, model=model)\n    return {\n        "prescription": system.parameters,\n        "performance": prediction,\n        "status": "awaiting_zemax_validation",\n    }\n\n# Backend execution is not connected in this mockup.\n# Files in this Explorer are preview examples.'},
 'workflows/train_model.py':{lang:'Python',text:'# Training entry point — illustrative code\nfrom training import TrainingRequest\n\ndef prepare_update(model, selected_case_ids):\n    return TrainingRequest(\n        parent_model=model,\n        case_ids=selected_case_ids,\n        learning_rate=0.001,\n        epochs=100,\n        save_as_new_version=True,\n    )\n\n# Existing model remains unchanged.\n# GPU and training backend: TBU.'},
 'workflows/zemax_sim.py':{lang:'Python',text:'# Zemax integration — illustrative code\ndef prepare_simulation(parameters, sampling):\n    return {\n        "parameters": parameters,\n        "sampling": sampling,\n        "engine": "Zemax",\n        "execution": "not_connected",\n    }'},
 'config/targets.json':{lang:'JSON',text:'{\n  "read_only": true,\n  "category_weights": {\n    "mtf": 1, "spot": 1, "horizontal_fov": 1\n  },\n  "targets": {\n    "mtf_6lp_0F_ST_min": 0.40,\n    "mtf_6lp_08F_ST_min": 0.30,\n    "spot_rms_diameter_um": 1.60,\n    "horizontal_full_fov_deg": 24\n  },\n  "relative_candidate_allowance": 0.05\n}'},
 'config/model-report.json':{lang:'JSON',text:'{\n  "model": "surrogate-v03.pth",\n  "database": "optics-cases.sqlite",\n  "training_membership": "TBU",\n  "next_version": "surrogate-v04.pth",\n  "overwrite_parent": false\n}'},
 'README.md':{lang:'Markdown',text:'# AI imaging optics workspace\n\n## Workflow\n1. Open an optical-system template.\n2. Inspect and select data in DB tailoring.\n3. Review the model and training settings.\n4. Explore parameters and request Zemax cases.\n\n## Preview boundary\nThis screen is a UI proposal.\nIt does not open real files, train models,\nconnect to Claude, or run Zemax.'}
};
const sample=Array.from({length:72},(_,i)=>{const group=i%3,j=Math.floor(i/3);return {id:'DEMO-'+String(i+1).padStart(3,'0'),material:['N-BK7','PMMA','PC'][group],surface:i%4===0?'STANDARD':'EVEN_ASPHERE',temperature:i%3===0?20:25,status:i%11===0?'INVALID':'VALID',group,x:group*2.35-2.6+Math.cos(j*1.8)*(.3+(j%6)*.12),y:(group===1?1.25:-.4)+Math.sin(j*1.3)*(.4+(j%7)*.1),ux:(group===2?1.6:-1.4)+Math.cos(j*.92+group)*(.2+(j%7)*.12),uy:group*1.65-1.7+Math.sin(j*1.37)*(.3+(j%5)*.12)};});
const s={view:'workspace',nav:'workspace',tabs:['workspace','tailoring'],chat:true,sidebar:true,labels:false,section:false,method:'PCA',material:'all',surface:'all',status:'all',temperature:'all',selection:[],training:[],folder:'AI imaging optics',output:'output',thickness:6.862,gap:9.734,radius:57,lr:'0.001',epochs:'100',compute:'Local GPU',simMode:'Manual',simCount:5,log:'[preview] Workspace를 열었습니다.\n[backend] 파일·분석·학습·Zemax·LLM 연결은 TBU입니다.'};
const design={labels:false,sidebarWidth:210,chatWidth:260};
let hoverId=null;
function save(){if(!window.openai?.setWidgetState)return;window.openai.setWidgetState({modelContent:{view:s.view,db_method:s.method,selected_cases:s.selection.length,training_cases:s.training.length,llm_open:s.chat,navigation_labels:s.labels},privateContent:{view:s.view,nav:s.nav,tabs:s.tabs,chat:s.chat,sidebar:s.sidebar,labels:s.labels,method:s.method,material:s.material,surface:s.surface,status:s.status,temperature:s.temperature,selection:s.selection,training:s.training,folder:s.folder,section:s.section}}).catch(()=>{});}
function restore(stored){const p=stored?.privateContent;if(!p||typeof p!=='object')return;for(const k of ['chat','sidebar','labels','section'])if(typeof p[k]==='boolean')s[k]=p[k];if(titles[p.nav])s.nav=p.nav;if(titles[p.view]||files[p.view])s.view=p.view;if(Array.isArray(p.tabs))s.tabs=p.tabs.filter(x=>titles[x]||files[x]).slice(0,8);if(!s.tabs.includes(s.view)&&s.view!=='explorer')s.tabs.push(s.view);if(['PCA','UMAP','User select from DB'].includes(p.method))s.method=p.method;for(const k of ['material','surface','status','temperature'])if(typeof p[k]==='string')s[k]=p[k];for(const k of ['selection','training'])if(Array.isArray(p[k]))s[k]=p[k].filter(id=>sample.some(r=>r.id===id));if(typeof p.folder==='string'&&p.folder.length<120)s.folder=p.folder;design.labels=s.labels;}
function drawIcons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function setLog(message){s.log='[preview] '+message+'\n[backend] 실제 작업은 실행하지 않았습니다.';drawOutput();}
function drawOutput(){let text=s.log;if(s.output==='jobs')text=s.training.length?'[draft] 학습 데이터 집합: '+s.training.length+'건\n실행 중인 작업 없음 · training / Zemax / auto design TBU':'실행 중인 작업 없음\nDB tailoring에서 학습용 데이터를 먼저 선택할 수 있습니다.';if(s.output==='terminal')text='터미널 영역 · TBU\n실제 VS Code 기반에서는 기본 Terminal을 사용하는 구성입니다.';$('ov-log').textContent=text;root.querySelectorAll('[data-output]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.output===s.output));}
function filtered(){return sample.filter(r=>(s.material==='all'||r.material===s.material)&&(s.surface==='all'||r.surface===s.surface)&&(s.status==='all'||r.status===s.status)&&(s.temperature==='all'||String(r.temperature)===s.temperature));}
function selectMarkup(id,label,options,value){return '<label class="ov-field"><span>'+label+'</span><select id="'+id+'">'+options.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(v===value?' selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select></label>';}
function fileButton(name,label){return '<button type="button" class="ov-file cursor-interaction" data-file="'+name+'" aria-current="'+(s.view===name)+'">'+icon(name.endsWith('.json')?'braces':name.endsWith('.md')?'file-text':'file-code-2')+esc(label||name)+'</button>';}
function drawSidebar(){
 $('ov-side-title').textContent=(titles[s.nav]||'Explorer').toUpperCase();let h='';
 if(s.nav==='explorer')h='<button type="button" class="ov-button ov-inline cursor-interaction" id="ov-open-folder">'+icon('folder-open')+' Open Folder…</button><div class="ov-folderform" id="ov-folder-form" hidden><label class="ov-field"><span>폴더 경로 · 선택 흐름 예시</span><input id="ov-folder-path" value="C:\\Projects\\AI imaging optics" aria-label="폴더 경로 예시"></label><button type="button" class="ov-primary cursor-interaction" id="ov-folder-apply">시안에 적용</button><div class="ov-small">실제 파일 읽기 TBU</div></div><div class="ov-project">⌄ '+esc(s.folder.toUpperCase())+'</div><div class="ov-filetree">'+fileButton('design_driver.py')+'<details open><summary>workflows</summary><div class="ov-treebranch">'+fileButton('workflows/train_model.py','train_model.py')+fileButton('workflows/zemax_sim.py','zemax_sim.py')+'</div></details><details open><summary>config</summary><div class="ov-treebranch">'+fileButton('config/targets.json','targets.json')+fileButton('config/model-report.json','model-report.json')+'</div></details><details open><summary>data</summary><div class="ov-treebranch"><button type="button" class="ov-file cursor-interaction" data-open-db>'+icon('database')+'optics-cases.sqlite</button><span class="ov-file ov-muted">'+icon('file')+'selected-cases.json</span></div></details>'+fileButton('README.md')+'</div><div class="ov-sectiontitle">OPEN EDITORS</div><div class="ov-small">Workspace · DB tailoring · 코드 파일</div>';
 if(s.nav==='workspace')h='<div class="ov-sectiontitle">'+icon('layers')+' TRIPLET · 3 LENSES</div>'+selectMarkup('ov-lens','선택 렌즈',['Lens 1','Lens 2','Lens 3'],'Lens 1')+selectMarkup('ov-material-ws','Material',['PC proxy','N-BK7','PMMA'],'PC proxy')+'<div class="ov-sectiontitle">ACTIVE PARAMETERS</div>'+param('thickness','L1 · Thickness',3,10,s.thickness,'mm')+param('radius','L1 Front · Radius R',16,160,s.radius,'mm')+param('gap','Image plane → L1',1,35,s.gap,'mm')+'<div class="ov-panel-note">파라미터·범위 표시 예시</div><div class="ov-sectiontitle">PRED MODEL</div><div class="ov-small">model-report.json<br>surrogate-v03.pth</div><button type="button" class="ov-button cursor-interaction" data-goto="update">모델 설정 열기</button>';
 if(s.nav==='tailoring')h='<div class="ov-sectiontitle">SOURCE DATABASE</div><div class="ov-project ov-inline">'+icon('database')+' optics-cases.sqlite</div><div class="ov-small">시안용 예시 '+sample.length+'건</div><div class="ov-sectiontitle">FILTERS · DB COLUMNS</div>'+selectMarkup('ov-filter-material','Material',[['all','All materials'],'N-BK7','PMMA','PC'],s.material)+selectMarkup('ov-filter-surface','Surface type',[['all','All types'],'STANDARD','EVEN_ASPHERE'],s.surface)+selectMarkup('ov-filter-temperature','Temperature (°C)',[['all','All temperatures'],'20','25'],s.temperature)+selectMarkup('ov-filter-status','Geometry / trace status',[['all','All statuses'],'VALID','INVALID'],s.status)+'<button type="button" class="ov-button cursor-interaction" id="ov-reset-filters">필터 초기화</button><div class="ov-sectiontitle">ANALYSIS FEATURES</div><div class="ov-small">Radius · Thickness · Gap<br>Conic · Clear semi-diameter</div><label class="ov-options"><input type="checkbox" checked> Standardize numeric features</label><div class="ov-sectiontitle">TRAINING SET</div><div class="ov-small" id="ov-side-train">'+s.training.length+' cases · 선택 집합</div>';
 if(s.nav==='update')h='<div class="ov-sectiontitle">MODELS</div><div class="ov-project ov-inline">'+icon('brain-circuit')+' surrogate-v03</div><div class="ov-small">model-report.json<br>현재 선택 모델</div><div class="ov-sectiontitle">DATA SELECTION</div><div class="ov-small">DB tailoring에서 선택한<br><strong style="font-weight:500;color:var(--ov-fg)">'+s.training.length+'개 케이스</strong></div><button type="button" class="ov-button cursor-interaction" data-goto="tailoring">학습 데이터 검토</button><div class="ov-sectiontitle">VERSION POLICY</div><div class="ov-small">새 버전으로 저장<br>기존 모델 보존</div>';
 if(s.nav==='sim')h='<div class="ov-sectiontitle">CURRENT DESIGN</div><div class="ov-project">Triplet · D057_2</div><div class="ov-small">활성 파라미터 범위 복사</div><div class="ov-sectiontitle">SAMPLING</div>'+selectMarkup('ov-sim-mode','Mode',['Manual','Auto'],s.simMode)+'<div class="ov-sectiontitle">ENGINE</div><div class="ov-small">Zemax · Backend TBU<br>라이선스 확인 TBU</div><div class="ov-sectiontitle">DATA DESTINATION</div><div class="ov-small">optics-cases.sqlite<br>완료된 케이스 누적 보존</div>';
 if(s.nav==='auto')h='<div class="ov-sectiontitle">TARGET PROFILE</div>'+fileButton('config/targets.json','targets.json')+'<div class="ov-small">읽기 전용 목표 · weights 1:1:1</div><div class="ov-sectiontitle">DESIGN CONSTRAINTS</div><div class="ov-small">3 lenses · Stop configuration<br>Parameter min / max bounds</div><div class="ov-sectiontitle">CANDIDATES</div><button type="button" class="ov-button cursor-interaction" data-goto="workspace">Workspace에서 후보 검토</button>';
 $('ov-side-body').innerHTML=h;
 root.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>openFile(b.dataset.file));root.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>openView(b.dataset.goto));
 if(s.nav==='explorer'){$('ov-open-folder').onclick=()=>{$('ov-folder-form').hidden=!$('ov-folder-form').hidden};$('ov-folder-apply').onclick=()=>{const value=$('ov-folder-path').value.trim();s.folder=value.split(/[\\/]/).filter(Boolean).pop()||'AI imaging optics';setLog('폴더 선택 흐름을 미리 봅니다. 실제 디렉토리를 읽지는 않았습니다.');draw();save()};root.querySelector('[data-open-db]').onclick=()=>openView('tailoring');}
 if(s.nav==='workspace')root.querySelectorAll('[data-param]').forEach(input=>{input.oninput=()=>{s[input.dataset.param]=Number(input.value);root.querySelector('[data-param-value="'+input.dataset.param+'"]').textContent=Number(input.value).toFixed(input.dataset.param==='radius'?1:3)+' mm';drawGeometry();};input.onchange=()=>{setLog('설계 파라미터를 변경했습니다. 성능 표시와 학습 영역은 시안 예시입니다.');save()};});
 if(s.nav==='tailoring'){for(const key of ['material','surface','status','temperature'])$('ov-filter-'+key).onchange=e=>{s[key]=e.target.value;drawContent();drawContexts();save()};$('ov-reset-filters').onclick=()=>{for(const key of ['material','surface','status','temperature'])s[key]='all';draw();save()};}
 if(s.nav==='sim')$('ov-sim-mode').onchange=e=>{s.simMode=e.target.value;drawContent();save()};
}
function param(key,label,min,max,value,unit){return '<div class="ov-param"><div class="ov-paramhead"><label><input type="checkbox" checked> '+label+'</label><output data-param-value="'+key+'">'+Number(value).toFixed(key==='radius'?1:3)+' '+unit+'</output></div><input type="range" min="'+min+'" max="'+max+'" step="0.001" value="'+value+'" data-param="'+key+'" aria-label="'+label+'"><div class="ov-rangelabels"><span>'+min+'</span><span>'+max+' '+unit+'</span></div></div>';}
function openView(view){s.nav=view;s.sidebar=true;if(view==='explorer'){if(!files[s.view])s.view='design_driver.py';if(!s.tabs.includes(s.view))s.tabs.push(s.view);}else{s.view=view;if(!s.tabs.includes(view))s.tabs.push(view);}draw();save();}

function toggleCase(id){s.selection=s.selection.includes(id)?s.selection.filter(v=>v!==id):[...s.selection,id];drawContent();drawContexts();save();}
function svgEl(tag,attrs={},text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}
function setupSvg(id,height){const svg=$(id);if(!svg)return null;const w=Math.max(180,Math.round(svg.getBoundingClientRect().width));svg.setAttribute('viewBox','0 0 '+w+' '+height);svg.replaceChildren();return {svg,w,h:height};}
function drawGeometry(){const a=setupSvg('ov-geometry',196);if(!a)return;const{svg,w,h}=a;svg.append(svgEl('line',{x1:20,y1:104,x2:w-20,y2:104,stroke:'var(--ov-dim)','stroke-width':1,'stroke-dasharray':'4 4',opacity:.5}));const x0=w*.17;svg.append(svgEl('line',{x1:x0,y1:41,x2:x0,y2:155,stroke:'var(--ov-green)','stroke-width':1.3}));svg.append(svgEl('text',{x:x0,y:178,'text-anchor':'middle',class:'ov-svgtext'},'Image plane'));const gapAdjust=(s.gap-9.734)*1.5;[.39,.58,.77].forEach((f,i)=>{const x=w*f+gapAdjust*(i+1)*.3,ww=i===0?Math.min(28,s.thickness*2.8):[0,19,25][i],hh=[57,67,62][i];let path;if(s.section){path='M '+(x-ww/2)+' '+(104-hh)+' Q '+(x+ww*.95)+' 104 '+(x-ww/2)+' '+(104+hh)+' L '+(x+ww/2)+' '+(104+hh)+' Q '+(x-ww*.95)+' 104 '+(x+ww/2)+' '+(104-hh)+' Z';}else{path='M '+(x-ww/2)+' '+(104-hh)+' C '+(x-43)+' '+(104-hh)+' '+(x-43)+' '+(104+hh)+' '+(x-ww/2)+' '+(104+hh)+' L '+(x+ww/2)+' '+(104+hh)+' C '+(x+40)+' '+(104+hh)+' '+(x+40)+' '+(104-hh)+' '+(x+ww/2)+' '+(104-hh)+' Z';}svg.append(svgEl('path',{d:path,fill:'var(--ov-glass)','fill-opacity':.18,stroke:'var(--ov-glass)','stroke-width':1.3}));if(!s.section)svg.append(svgEl('ellipse',{cx:x+ww/2,cy:104,rx:25,ry:hh,fill:'var(--ov-glass)','fill-opacity':.09,stroke:'var(--ov-glass)','stroke-width':1}));svg.append(svgEl('text',{x,y:184,'text-anchor':'middle',class:'ov-svgtext'},'L'+(i+1)));});svg.append(svgEl('text',{x:w-10,y:17,'text-anchor':'end',class:'ov-svgtext'},s.section?'Section / mm':'Geometry preview'));}
function drawWorkspacePlots(){drawGeometry();let a=setupSvg('ov-mtf',135);if(a){let{svg,w}=a;const x=v=>30+(w-42)*v/30,y=v=>104-78*v;[0,.5,1].forEach(t=>{svg.append(svgEl('line',{x1:30,y1:y(t),x2:w-12,y2:y(t),class:'ov-gridline'}));svg.append(svgEl('text',{x:25,y:y(t)+4,'text-anchor':'end',class:'ov-svgtext'},Math.round(t*100)))});[0,10,20,30].forEach(t=>svg.append(svgEl('text',{x:x(t),y:118,'text-anchor':'middle',class:'ov-svgtext'},t)));for(let k=0;k<3;k++){const points=Array.from({length:31},(_,i)=>x(i)+','+y(Math.exp(-Math.pow(i/(18-k*2),1.65)))).join(' ');svg.append(svgEl('polyline',{points,fill:'none',stroke:k===2?'var(--ov-purple)':'var(--ov-blue)','stroke-width':1.6,'stroke-dasharray':k===1?'4 3':'none',opacity:1-k*.15}));}svg.append(svgEl('text',{x:w-10,y:132,'text-anchor':'end',class:'ov-svgtext'},'lp/mm'));}a=setupSvg('ov-spot',135);if(a){let{svg,w}=a;const cx=w/2,cy=67;svg.append(svgEl('line',{x1:20,y1:cy,x2:w-12,y2:cy,class:'ov-gridline'}));svg.append(svgEl('line',{x1:cx,y1:20,x2:cx,y2:110,class:'ov-gridline'}));for(let i=0;i<45;i++){const t=i*2.399,r=4+Math.sqrt(i)*4.3;svg.append(svgEl('circle',{cx:cx+Math.cos(t)*r,cy:cy+Math.sin(t)*r*.75,r:1.7,fill:'var(--ov-blue)',opacity:.7}));}svg.append(svgEl('text',{x:cx,y:128,'text-anchor':'middle',class:'ov-svgtext'},'RMS diameter 48.71 μm · 예시'));}}
function drawScatter(){const a=setupSvg('ov-scatter',238);if(!a)return;const{svg,w,h}=a,rows=filtered();const px=r=>s.method==='PCA'?r.x:r.ux,py=r=>s.method==='PCA'?r.y:r.uy;const xs=sample.map(px),ys=sample.map(py),xmin=Math.min(...xs)-.35,xmax=Math.max(...xs)+.35,ymin=Math.min(...ys)-.35,ymax=Math.max(...ys)+.35;const left=40,right=w-16,top=18,bottom=205;const x=v=>left+(v-xmin)/(xmax-xmin)*(right-left),y=v=>bottom-(v-ymin)/(ymax-ymin)*(bottom-top);for(let i=0;i<4;i++){const xx=left+(right-left)*i/3,yy=top+(bottom-top)*i/3;svg.append(svgEl('line',{x1:xx,y1:top,x2:xx,y2:bottom,class:'ov-gridline'}));svg.append(svgEl('line',{x1:left,y1:yy,x2:right,y2:yy,class:'ov-gridline'}));}svg.append(svgEl('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--ov-line)'}));svg.append(svgEl('text',{x:(left+right)/2,y:229,'text-anchor':'middle',class:'ov-svgtext'},s.method==='PCA'?'PC1':'UMAP 1'));svg.append(svgEl('text',{x:10,y:13,class:'ov-svgtext'},s.method==='PCA'?'PC2':'UMAP 2'));rows.forEach(r=>{const chosen=s.selection.includes(r.id),xx=x(px(r)),yy=y(py(r));if(chosen)svg.append(svgEl('circle',{cx:xx,cy:yy,r:6,fill:'none',stroke:'var(--ov-orange)','stroke-width':1.5}));svg.append(svgEl('circle',{cx:xx,cy:yy,r:chosen?3.5:3,fill:['var(--ov-blue)','var(--ov-green)','var(--ov-purple)'][r.group],opacity:r.status==='INVALID'?.4:.9}));});const overlay=svgEl('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'transparent'});svg.append(overlay);function nearest(e){const b=svg.getBoundingClientRect(),xx=(e.clientX-b.left)*w/b.width,yy=(e.clientY-b.top)*h/b.height;let row=null,d=18;for(const r of rows){const dd=Math.hypot(x(px(r))-xx,y(py(r))-yy);if(dd<d){d=dd;row=r}}return row}overlay.onpointermove=e=>{const r=nearest(e);hoverId=r?.id||null;if($('ov-hover-info'))$('ov-hover-info').textContent=r?r.id+' · '+r.material+' · '+r.surface+' · '+r.temperature+'°C · '+(s.selection.includes(r.id)?'선택됨':'클릭하여 선택'):'배치 예시 · 학습 신뢰도를 나타내지 않습니다.'};overlay.onclick function applyLayout(){s.labels=design.labels;root.style.setProperty('--ov-sidebar',design.sidebarWidth+'px');root.style.setProperty('--ov-chat',design.chatWidth+'px');root.dataset.chat=String(s.chat);root.dataset.sidebar=String(s.sidebar);root.dataset.labels=String(s.labels);$('ov-sidebar').hidden=!s.sidebar;$('ov-chat').hidden=!s.chat;$('ov-chat-toggle').setAttribute('aria-pressed',s.chat);}
function draw(){applyLayout();$('ov-project-title').textContent=s.folder;root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',s.nav===b.dataset.view));$('ov-state-view').textContent=titles[s.nav]||'Explorer';drawSidebar();drawTabs();drawContent();drawContexts();drawOutput();drawIcons();}
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openView(b.dataset.view));
function toggleChat(){s.chat=!s.chat;applyLayout();requestAnimationFrame(()=>{if(s.view==='workspace')drawWorkspacePlots();if(s.view==='tailoring')drawScatter()});save();}
function toggleSidebar(){s.sidebar=!s.sidebar;applyLayout();requestAnimationFrame(()=>{if(s.view==='workspace')drawWorkspacePlots();if(s.view==='tailoring')drawScatter()});save();}
$('ov-chat-toggle').onclick=toggleChat;$('ov-chat-close').onclick=toggleChat;$('ov-sidebar-toggle').onclick=toggleSidebar;$('ov-label-toggle').onclick=()=>{design.labels=!design.labels;applyLayout();requestAnimationFrame(()=>{drawWorkspacePlots();drawScatter()});save()};
root.addEventListener('keydown',e=>{const modifier=e.ctrlKey||e.metaKey,isB=e.code==='KeyB'||e.key.toLowerCase()==='b';if(modifier&&e.altKey&&isB){e.preventDefault();toggleChat()}else if(modifier&&!e.altKey&&isB){e.preventDefault();toggleSidebar()}});
root.querySelectorAll('[data-output]').forEach(b=>b.onclick=()=>{s.output=b.dataset.output;drawOutput();save()});root.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('ov-prompt').value=b.dataset.prompt;$('ov-prompt').focus()});
$('ov-preview-request').onclick=()=>{const prompt=$('ov-prompt').value.trim();if(!prompt)return;const m=$('ov-messages');m.replaceChildren();const user=document.createElement('div');user.className='ov-message';const u=document.createElement('strong');u.textContent='You';user.append(u,document.createTextNode(prompt));const reply=document.createElement('div');reply.className='ov-message';const r=document.createElement('strong');r.textContent='계획 예시 · Claude 응답 아님';reply.append(r,document.createTextNode('1. 현재 목표·제약 확인\n2. '+s.training.length+'개 선택 데이터와 현재 설계 검토\n3. 필요한 Python 작업 계획 제안\n4. 실행 전 확인'));reply.style.whiteSpace='pre-line';m.append(user,reply);$('ov-chat-empty').hidden=true;setLog('LLM 요청 초안의 계획 예시를 표시했습니다. 외부 전송과 Python 실행은 하지 않았습니다.');};
restore(window.openai?.widgetState);draw();
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);draw()}});
let lastWidth=0,pending=false;new ResizeObserver(entries=>{const width=entries[0]?.contentRect.width;if(width===lastWidth)return;lastWidth=width;if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;if(s.view==='workspace')drawWorkspacePlots();if(s.view==='tailoring')drawScatter()})}).observe($('ov-editor'));
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyLayout();requestAnimationFrame(()=>{drawWorkspacePlots();drawScatter()});save()}});tweak.addToggle(design,'labels',{label:'왼쪽 메뉴 이름 표시'});tweak.addSlider(design,'sidebarWidth',{label:'왼쪽 설정 패널 너비',min:180,max:270,step:10,unit:'px'});tweak.addSlider(design,'chatWidth',{label:'LLM 패널 너비',min:220,max:340,step:10,unit:'px'});}
})();
</script>
</div>
